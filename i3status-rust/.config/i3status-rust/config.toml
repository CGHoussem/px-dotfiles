icons_format = "{icon}"

[theme]
theme = "srcery"
[theme.overrides]
idle_bg = "#2D7729"
idle_fg = "#FFFFFF"
good_bg = "#2D7729"
good_fg = { link = "idle_fg" }
warning_bg = "#D9822B"
warning_fg = "#FFFFFF"
critical_bg = "#D72631"
critical_fg = "#FFFFFF"

[icons]
icons = "awesome4"

[[block]]
block = "net"
format = " $icon {$signal_strength $ssid $frequency|Wired } via $device "

[[block]]
block = "cpu"
info_cpu = 20
warning_cpu = 50
critical_cpu = 90

[[block]]
block = "nvidia_gpu"
interval = 10
format = " GPU $utilization $memory $temperature "

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
alert_unit = "GB"
interval = 20
warning = 20.0
alert = 10.0
format = " $icon  root: $available.eng(w:2) "
format_alt = " $icon  root: $used.eng(w:2) / $total.eng(w:2) "

[[block]]
block = "disk_space"
path = "/home"
info_type = "available"
alert_unit = "GB"
interval = 10
warning = 20.0
alert = 10.0
format = " $icon  home: $available.eng(w:2) "
format_alt = " $icon  home: $used.eng(w:2) / $total.eng(w:2) "

[[block]]
block = "disk_space"
path = "/tmp"
info_type = "available"
alert_unit = "GB"
interval = 10
warning = 4.0
alert = 1.0
format = " $icon  tmp: $available.eng(w:2) "
format_alt = " $icon  tmp: $used.eng(w:2) / $total.eng(w:2) "

[[block]]
block = "memory"
format = " $icon  $mem_total_used_percents.eng(w:2) "
format_alt = " $icon_swap  $swap_used_percents.eng(w:2) "

[[block]]
block = "sound"
[[block.click]]
button = "left"
cmd = "pavucontrol"

[[block]]
block = "time"
interval = 5
format = " $timestamp.datetime(f:'%a %d/%m %R') "
